name: Vercel Preview Deployment

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: Preview
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Create public directory if not exists
        run: |
          if [ ! -d "public" ]; then
            mkdir -p public
            echo "# GlassWall Public Directory" > public/README.md
            echo "This directory contains static assets that are served directly by the web server." >> public/README.md
          fi
        
      - name: Build project
        run: npm run build
        
      - name: Run tests
        run: npm test || echo "No tests specified"
        
      - name: Deploy to Vercel (Preview)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          github-comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}